name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          for f in index.html manifest.webmanifest sw.js icon.svg icon-180.png icon-512.png; do
            test -f "$f" || { echo "Missing file: $f"; exit 1; }
          done

      - name: Build site folder
        run: |
          mkdir _site
          cp index.html manifest.webmanifest sw.js icon.svg icon-180.png icon-512.png _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
